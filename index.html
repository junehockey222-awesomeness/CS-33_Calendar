<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calendar-container">
        <header>
            <button id="prevBtn">◀ Prev</button>
            <h1 id="monthYearDisplay"></h1>
            <button id="nextBtn">Next ▶</button>
        </header>
        <div class="weekdays-grid">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div id="daysGrid" class="days-grid"></div>
    </div>
    <script src="app.js"></script>
    <!-- Beautiful Interactive Modal Overlay -->
    <div id="courseModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <span id="modalCategory" class="modal-category-badge">Lecture</span>
                <button id="closeModalBtn" class="close-icon-btn">&times;</button>
            </div>
            <div class="modal-body">
                <h2 id="modalTitle">Introduction to Algorithms</h2>
                <div class="modal-detail-item">
                    <span class="detail-label">📅 Date:</span>
                    <span id="modalDateVal">Wednesday, July 29, 2026</span>
                </div>
                <div class="modal-detail-item">
                    <span class="detail-label">📖 Assignment:</span>
                    <span id="modalAssignmentVal">Lab 0: Sandbox Setup</span>
                </div>
                <div class="modal-detail-item">
                    <span class="detail-label">⏳ Due:</span>
                    <span id="modalDueVal">Aug 2 at 11:59 PM</span>
                </div>
                
                <div class="modal-action-row">
                    <a id="modalSlideLink" href="#" target="_blank" class="action-btn slide-btn">📥 Download Slides</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
