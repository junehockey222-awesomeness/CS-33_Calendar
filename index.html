<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Calendar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="calendar-header">
    <div class="nav-controls">
      <button id="prev-btn">&lt; Prev</button>
      <h2 id="month-year-display">Month Year</h2>
      <button id="next-btn">Next &gt;</button>
    </div>
    <div class="filter-controls">
      <label for="category-filter">Filter:</label>
      <select id="category-filter">
        <option value="all">All Events</option>
        <option value="Training">Training</option>
        <option value="Fitness">Fitness</option>
        <option value="Social">Social</option>
        <option value="Other">Other</option>
      </select>
      <button id="open-modal-btn">+ Add Event</button>
    </div>
  </header>

  <!-- Calendar Days Header -->
  <div class="weekdays-grid">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>

  <!-- Calendar Days Container -->
  <div id="calendar-grid" class="calendar-grid"></div>

  <!-- Add Event Modal -->
  <div id="event-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>Add New Event</h3>
      <form id="event-form">
        <label>Title:
          <input type="text" id="event-title" required placeholder="Event name...">
        </label>
        <label>Date:
          <input type="date" id="event-date" required>
        </label>
        <label>Category:
          <select id="event-category">
            <option value="Training">Training</option>
            <option value="Fitness">Fitness</option>
            <option value="Social">Social</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <div class="modal-actions">
          <button type="button" id="close-modal-btn">Cancel</button>
          <button type="submit">Save Event</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
